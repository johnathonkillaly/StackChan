[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackchan-bridge"
version = "0.1.0"
description = "Local-first bridge and agent framework for StackChan and CoreS3 devices."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" },
]
dependencies = [
  "fastapi>=0.115.12",
  "httpx>=0.28.1",
  "msgpack>=1.1.2",
  "pydantic>=2.11.3",
  "pyserial>=3.5",
  "python-dotenv>=1.1.0",
  "uvicorn[standard]>=0.34.2",
  "websockets>=15.0.1",
]

[project.scripts]
stackchan-bridge = "stackchan_bridge.__main__:main"
stackchan-rover-service = "stackchan_bridge.rover.cli:main_service"
stackchan-rover-replay = "stackchan_bridge.rover.cli:main_replay"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/stackchan_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"src/stackchan_bridge" = "stackchan_bridge"
